[package]
name        = "bpan"
version     = "0.2.0"
edition     = "2021"
rust-version = "1.75"
description = "AI-agent-first CLI + Rust SDK for Baidu Netdisk personal Open Platform"
license     = "Apache-2.0"
repository  = "https://github.com/ljh-sh/bpan"
homepage    = "https://ljh-sh.github.io/bpan/"
keywords    = ["baidu", "netdisk", "cloud-storage", "api", "sdk", "agent", "cli"]
categories  = ["api-bindings", "command-line-interface", "filesystem"]
readme      = "README.md"

[lib]
name = "bpan"
path = "src/lib.rs"

[[bin]]
name = "bpan"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
thiserror = "1"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
schemars = "0.8"
async-trait = "0.1"
futures-util = "0.3"
url = "2"
tracing = "0.1"
md5 = "0.7"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"